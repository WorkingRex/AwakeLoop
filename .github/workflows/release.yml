name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build universal installer
        run: sh build-dmg.sh

      - name: Verify installer
        run: |
          lipo -info build/AwakeLoop.app/Contents/MacOS/AwakeLoop
          hdiutil verify build/AwakeLoop-Installer.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/AwakeLoop-Installer.dmg
          --title "AwakeLoop $GITHUB_REF_NAME"
          --generate-notes